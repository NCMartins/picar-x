[project]
name = "picar-x"
version = "1.0.0"
description = "Modular web-based control system for Sunfounder PiCar-X robot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PiCar Developer"}]

dependencies = [
    "flask>=2.3.0",
    "flask-cors>=4.0.0",
    "Werkzeug>=2.3.0",
    "waitress>=2.1.2",
    # picamera2 is intentionally not listed here: it ships as a system
    # package on Raspberry Pi OS (built against libcamera) and generally
    # can't be installed from PyPI on its own. Install it via apt, or use
    # `uv venv --system-site-packages` so the venv can see the system copy.
    # It's still listed in requirements.txt for the Pi install path.
    "robot-hat",
    # Voice control. Harmless when unused: without ANTHROPIC_API_KEY the
    # voice routes stay registered but refuse, and nothing imports the
    # client.
    "anthropic>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.4.1",
]
[tool.setuptools]
# Only these two directories are Python packages; everything else
# (ansible/, frontend/, backend/, docs/, etc.) is picked up as project
# files but isn't part of the installable package.
packages = ["picar", "config"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"
